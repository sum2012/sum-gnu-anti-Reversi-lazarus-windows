name: Lazarus Build for Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable

      - name: Build Lazarus Project
        run: |
          lazbuild --cpu=x86_64 --os=win64 SumAntiReversi8x8.lpi

      - name: Run Auto Test
        run: |
          ./SumAntiReversi8x8.exe --test
          if (Test-Path test_output.txt) {
            cat test_output.txt
            Select-String -Pattern "-1: 6,3->1,4->4,3->2,6->5,6->5,2->4,1->6,1->5," -Path test_output.txt
          } else {
            Write-Error "test_output.txt not found"
            exit 1
          }

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows Build
          path: |
            *.exe
            *.dll
            bin/
