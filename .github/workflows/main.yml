name: Lazarus Build for Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Lazarus
        run: |
          # Download and install Lazarus
          choco install lazarus -y
          # Add Lazarus to PATH
          echo "C:\Program Files (x86)\Lazarus" >> $env:GITHUB_PATH

      - name: Build Lazarus Project
        run: |
          # Navigate to the project directory
          cd ${{ github.workspace }}
          # Build the project using Lazarus
          lazbuild.exe --cpu=x86_64 --os=win64 --build-mode=Release --build-compiler=fpc --build-config=Release --build-profile=Release --build-flags="-dRelease" --build-target=win64 --build-output-dir="bin" "SumAntiReversi8x8.lpi"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Windows Build
          path: bin/